<!DOCTYPE html>
<!-- header -->
<html lang="en">
<head>
    <link rel="icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Orbitron:wght@500;700&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; }

        :root {
            --bg:       #07091a;
            --surface:  rgba(255,255,255,0.03);
            --border:   rgba(180,160,240,0.12);
            --lavender: #c4b5e8;
            --violet:   #9d87d4;
            --gold:     #e4c87a;
            --rose:     #d4a8b8;
            --dim:      rgba(180,160,220,0.45);
        }

        nav {
            position: relative;
            background: var(--bg);
            overflow: hidden;
        }

        nav::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 160px;
            opacity: 0.6;
            pointer-events: none;
        }

        nav::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--violet) 30%,
                var(--gold) 55%,
                var(--rose) 75%,
                transparent 100%);
            opacity: 0.5;
        }

        .nav-inner {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: stretch;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-block {
            display: flex;
            align-items: center;
            padding: 16px 32px 16px 28px;
            flex-shrink: 0;
            position: relative;
        }

        .logo-block::after {
            content: '';
            position: absolute;
            right: 0; top: 22%; bottom: 22%;
            width: 1px;
            background: linear-gradient(180deg,
                transparent,
                var(--violet) 40%,
                var(--gold) 60%,
                transparent);
            opacity: 0.35;
        }

        .logo-block a {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--lavender);
            display: flex;
            align-items: center;
            gap: 11px;
            transition: color 0.3s ease;
        }

        .logo-mark {
            position: relative;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .logo-mark svg { width: 100%; height: 100%; overflow: visible; }

        .logo-mark .ring {
            animation: ringPulse 4s ease-in-out infinite;
            transform-origin: 11px 11px;
        }

        .logo-mark .dot-center { animation: dotBreathe 4s ease-in-out infinite; }

        @keyframes ringPulse {
            0%, 100% { opacity: 0.5; transform: scale(1) rotate(0deg); }
            50%       { opacity: 0.9; transform: scale(1.12) rotate(45deg); }
        }

        @keyframes dotBreathe {
            0%, 100% { opacity: 0.7; r: 2; }
            50%       { opacity: 1;   r: 2.8; }
        }

        .logo-block a:hover { color: #f0eaff; }

        .links-block {
            display: flex;
            align-items: center;
            padding: 0 20px 0 28px;
